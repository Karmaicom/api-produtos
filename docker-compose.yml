services:

  postgres:
    image: postgres:16
    container_name: postgres-api-produtos
    restart: always
    environment:
      POSTGRES_DB: db-api-produtos
      POSTGRES_USER: coti
      POSTGRES_PASSWORD: Coti@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-api-produtos
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Coti@2026
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app_network


volumes:
  postgres_data:
    name: postgres_api_produtos
  pgadmin_data:
    name: pgadmin_api_produtos

networks:
  app_network:
    name: app_network
    driver: bridge